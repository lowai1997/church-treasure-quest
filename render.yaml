services:
  - type: web
    name: church-treasure-quest
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BOX_PRICE
        value: 100
      - key: TEACHER_REGISTER_KEY
        value: Amen2026
      - key: WORLD_BOSS_MAX_HP
        value: 3024000000
      - key: WORLD_BOSS_SETTLE_SECONDS
        value: 10
